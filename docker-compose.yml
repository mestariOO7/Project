services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://kanban:kanban@db:5432/kanban?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:8080
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  postgres_data:
